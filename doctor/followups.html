<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow-ups — LIFE PATCH</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  <script src="../js/vendor/lucide.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>
    <div class="main-wrapper">
      <div id="header-mount"></div>

      <main class="main-content" style="max-width: 920px;">
        <div style="margin-bottom: 1.5rem;">
          <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;" data-i18n="followups">
            Patient Follow-up & Care Continuity
          </h1>
          <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.15rem;" data-i18n="fuSubtitle">
            Schedule chronic disease recalls, post-hospitalization checkups, and ASHA field visit tasks.
          </p>
        </div>

        <!-- Follow-up Schedule Form -->
        <div class="card" style="margin-bottom: 2rem;">
          <div class="card-header">
            <span class="card-title">
              <i data-lucide="calendar-plus" style="width: 18px; height: 18px; color: var(--primary-blue);"></i>
              <span data-i18n="fuFormTitle">Schedule Clinical Follow-up</span>
            </span>
            <span class="badge badge-info" data-i18n="fuBadgeProtocol">Care Protocol</span>
          </div>
          <form id="followup-form">
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label" data-i18n-html="fuPatientLabel">Registered Patient <span class="required">*</span></label>
                <select id="fu-patient" class="form-control" required>
                  <!-- Populated from DB -->
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" data-i18n-html="fuDateLabel">Scheduled Date <span class="required">*</span></label>
                <input type="date" id="fu-date" class="form-control" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" data-i18n="fuReasonLabel">Clinical Follow-up Objective & Vitals Target</label>
              <input type="text" id="fu-reason" class="form-control" placeholder="e.g. 2-week BP check & fasting glucose review after starting Metformin" data-i18n-attr="placeholder" data-i18n="fuReasonPh" value="2-week BP & fasting glucose check after medication adjustment" required>
            </div>

            <div class="form-group">
              <label class="form-label" data-i18n="fuAshaLabel">Assign Field ASHA Worker for Home Visit</label>
              <select id="fu-asha" class="form-control">
                <option value="Sunita Bai (ASHA Sector 3)" selected data-i18n="fuAsha1">Sunita Bai (ASHA Sector 3 - Kondapur)</option>
                <option value="Rekha Devi (ASHA Sector 2)" data-i18n="fuAsha2">Rekha Devi (ASHA Sector 2 - Shankarpally)</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary btn-lg">
              <i data-lucide="check" style="width: 16px; height: 16px;"></i>
              <span data-i18n="fuSubmitBtn">Schedule & Dispatch Notification to ASHA</span>
            </button>
          </form>
        </div>

        <!-- Scheduled Follow-ups Roster -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">
              <i data-lucide="clock" style="width: 18px; height: 18px; color: var(--primary-green);"></i>
              <span data-i18n="fuListTitle">Active Care Follow-ups</span>
            </span>
            <span class="badge badge-verified" id="fu-count-badge">Active</span>
          </div>
          <div id="followups-roster-mount">
            <!-- Dynamically Populated -->
          </div>
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script type="module">
    import { initDatabase, getPatients, getAppointments, addAppointment } from '../js/db/api.js';
    import { initI18n } from '../js/core/i18n.js';
    import { initTheme } from '../js/core/theme.js';
    import { renderLayout, showToast } from '../js/core/layout.js';
    import { renderIcons } from '../js/core/icons.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      await initI18n();
      await initTheme();
      renderLayout('doctor-followups');

      const patients = await getPatients();
      const patSelect = document.getElementById('fu-patient');
      patSelect.innerHTML = patients.map(p => `
        <option value="${p.id}">${p.name} (${p.healthId}) - ${p.village}</option>
      `).join('');

      // Default date to 7 days in future
      const targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + 7);
      document.getElementById('fu-date').value = targetDate.toISOString().split('T')[0];

      async function loadRoster() {
        const apts = await getAppointments('pat-1');
        const mount = document.getElementById('followups-roster-mount');
        document.getElementById('fu-count-badge').textContent = `${apts.length} Scheduled`;

        if (apts.length === 0) {
          mount.innerHTML = '<div style="padding:1.5rem; text-align:center; color:var(--text-muted);">No follow-ups currently scheduled.</div>';
          return;
        }

        mount.innerHTML = apts.map(a => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem; border-bottom:1px solid var(--border-subtle); flex-wrap:wrap; gap:0.5rem;">
            <div>
              <div style="font-weight:700; font-size:0.95rem; color:var(--text-main);">${a.title || a.type || 'Follow-up Consultation'}</div>
              <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:0.15rem;">Date: <strong>${a.date}</strong> at ${a.timeSlot || a.time || '10:00 AM'} • Facility: ${a.facility}</div>
              <div style="font-size:0.75rem; color:var(--primary-blue); margin-top:0.15rem;">Doctor: ${a.doctor || 'Dr. Ananya Rao'} • Assigned ASHA: Sunita Bai</div>
            </div>
            <div>
              <span class="badge badge-routine">${a.status || 'Scheduled'}</span>
            </div>
          </div>
        `).join('');

        renderIcons(mount);
      }

      document.getElementById('followup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pId = patSelect.value;
        const d = document.getElementById('fu-date').value;
        const reason = document.getElementById('fu-reason').value;

        await addAppointment({
          patientId: pId,
          doctor: 'Dr. Ananya Rao',
          facility: 'PHC Kondapur',
          date: d,
          time: '10:30 AM',
          title: `Follow-up: ${reason}`,
          status: 'Scheduled'
        });

        showToast('Follow-up scheduled and notification queued', 'success');
        await loadRoster();
      });

      await loadRoster();
    });
  </script>
</body>
</html>
