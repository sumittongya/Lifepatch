<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Field Visit — LIFE PATCH</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  <script src="../js/vendor/lucide.js"></script>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>
    <div class="main-wrapper">
      <div id="header-mount"></div>

      <main class="main-content" style="max-width: 820px;">
        <div style="margin-bottom: 1.5rem;">
          <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;" data-i18n="fieldVisit">
            ASHA Household Field Visit Form
          </h1>
          <p style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.15rem;">
            Record physical vitals, blood glucose, and symptom observations directly at the patient's home.
          </p>
        </div>

        <div class="card" style="padding: 2rem;">
          <form id="visit-form">
            <div class="form-group">
              <label class="form-label">Select Citizen / Household Patient <span class="required">*</span></label>
              <select id="v-patient" class="form-control" required>
                <!-- Populated from DB -->
              </select>
            </div>

            <!-- Vitals Grid -->
            <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1rem; margin: 1.5rem 0 0.75rem 0; color: var(--primary-green);">
              <i data-lucide="activity" style="width: 18px; height: 18px;"></i>
              <span>Vital Sign Measurements</span>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label">Blood Pressure (Systolic / Diastolic mmHg)</label>
                <div style="display:flex; gap:0.5rem; align-items:center;">
                  <input type="number" id="v-sys" class="form-control" placeholder="Systolic (e.g. 140)" value="142" required>
                  <span style="font-weight: 700; color: var(--text-muted);">/</span>
                  <input type="number" id="v-dia" class="form-control" placeholder="Diastolic (e.g. 90)" value="88" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Random Blood Glucose (mg/dL)</label>
                <input type="number" id="v-sugar" class="form-control" placeholder="e.g. 165" value="170">
              </div>
            </div>

            <div class="grid-3">
              <div class="form-group">
                <label class="form-label">Heart Rate (bpm)</label>
                <input type="number" id="v-hr" class="form-control" value="82" required>
              </div>

              <div class="form-group">
                <label class="form-label">Oxygen SpO2 (%)</label>
                <input type="number" id="v-spo2" class="form-control" value="98" required>
              </div>

              <div class="form-group">
                <label class="form-label">Temperature (°F)</label>
                <input type="number" step="0.1" id="v-temp" class="form-control" value="98.4" required>
              </div>
            </div>

            <!-- Symptom & Observation Notes -->
            <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1rem; margin: 1.5rem 0 0.75rem 0; color: var(--primary-indigo);">
              <i data-lucide="clipboard" style="width: 18px; height: 18px;"></i>
              <span>Symptom & Household Observations</span>
            </div>

            <div class="form-group">
              <label class="form-label">Chief Complaint & Citizen Description</label>
              <textarea id="v-notes" class="form-control" rows="3" placeholder="e.g. Patient mentioned feeling lightheaded when getting out of bed. Medication compliance is good.">Patient reported mild morning dizziness. Confirmed regular intake of Metformin. Advised to reduce salt and visit PHC OPD for doctor review.</textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
              <a href="dashboard.html" class="btn btn-outline">Cancel</a>
              <button type="submit" class="btn btn-success btn-lg">
                <i data-lucide="save" style="width: 16px; height: 16px;"></i>
                <span>Save & Sync Visit Record</span>
              </button>
            </div>
          </form>
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script type="module">
    import { initDatabase, getPatients, addVitals, addMedicalRecord, addOfflineItem } from '../js/db/api.js';
    import { initI18n } from '../js/core/i18n.js';
    import { initTheme } from '../js/core/theme.js';
    import { renderLayout, showToast } from '../js/core/layout.js';
    import { renderIcons } from '../js/core/icons.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      await initI18n();
      await initTheme();
      renderLayout('worker-visit');

      const patients = await getPatients();
      const patSelect = document.getElementById('v-patient');
      const urlParams = new URLSearchParams(window.location.search);
      const preselectedId = urlParams.get('id') || 'pat-1';

      patSelect.innerHTML = patients.map(p => `
        <option value="${p.id}" ${p.id === preselectedId ? 'selected' : ''}>
          ${p.name} (${p.healthId}) - ${p.village}
        </option>
      `).join('');

      document.getElementById('visit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pId = patSelect.value;
        const sys = parseInt(document.getElementById('v-sys').value, 10);
        const dia = parseInt(document.getElementById('v-dia').value, 10);
        const sugar = parseInt(document.getElementById('v-sugar').value, 10);
        const hr = parseInt(document.getElementById('v-hr').value, 10);
        const spo2 = parseInt(document.getElementById('v-spo2').value, 10);
        const temp = parseFloat(document.getElementById('v-temp').value);
        const notes = document.getElementById('v-notes').value;

        // Save vitals
        await addVitals({
          patientId: pId,
          bpSystolic: sys,
          bpDiastolic: dia,
          bloodSugarRandom: sugar,
          heartRate: hr,
          spo2: spo2,
          temperature: temp,
          recordedBy: 'Sunita Bai (ASHA)',
          recordedAt: new Date().toISOString()
        });

        // Add to medical timeline
        await addMedicalRecord({
          patientId: pId,
          type: 'visit',
          title: 'ASHA Home Field Checkup',
          facility: 'Kondapur Household Visit',
          doctor: 'Sunita Bai (ASHA)',
          date: new Date().toISOString().split('T')[0],
          summary: `BP: ${sys}/${dia} mmHg, Sugar: ${sugar} mg/dL, SpO2: ${spo2}%. Notes: ${notes}`,
          status: 'Clinically Verified',
          createdBy: 'Sunita Bai (ASHA)'
        });

        showToast('Field visit vitals saved and added to longitudinal EHR', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);
      });

      renderIcons();
    });
  </script>
</body>
</html>
