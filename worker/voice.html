<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASHA Voice Entry — LIFE PATCH</title>
  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  <script src="../js/vendor/lucide.js"></script>
  <style>
    .voice-recorder-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2.5rem 1.5rem;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
    }
    .mic-button {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--primary-green-gradient);
      color: #FFFFFF;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(13, 148, 136, 0.35);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .mic-button:hover { transform: scale(1.06); }
    .mic-button.recording {
      background: linear-gradient(135deg, #DC2626 0%, #991B1B 100%);
      animation: pulse-mic 1.4s infinite;
      box-shadow: 0 0 25px rgba(220, 38, 38, 0.5);
    }
    @keyframes pulse-mic {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .sample-prompt-chip {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 0.4rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .sample-prompt-chip:hover {
      background: var(--primary-green-light);
      border-color: var(--primary-green);
      color: var(--primary-green);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="sidebar-mount"></div>
    <div class="main-wrapper">
      <div id="header-mount"></div>

      <main class="main-content" style="max-width: 720px;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;" data-i18n="voiceEntry">
            ASHA Field Voice Observation
          </h1>
          <p style="font-size: 0.95rem; color: var(--text-secondary); max-width: 500px; margin: 0.5rem auto 0 auto;" data-i18n="workVoiceSubtitle">
            Speak in Telugu, Hindi, or English during household visits to record rapid clinical observations.
          </p>
        </div>

        <div class="voice-recorder-box" style="border-top: 4px solid var(--primary-green);">
          <div class="form-group" style="text-align: left; max-width: 400px; margin: 0 auto 1.5rem auto;">
            <label class="form-label" data-i18n="workVoicePatLabel">Citizen / Household Patient</label>
            <select id="voice-pat-select" class="form-control">
              <!-- Populated from DB -->
            </select>
          </div>

          <div style="margin-bottom: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 0.6rem;">
            <span style="font-size: 0.85rem; font-weight: 700; color: var(--text-secondary);" data-i18n="workVoiceLangLabel">Voice Language:</span>
            <select id="asha-voice-lang" class="form-control" style="width: auto; height: 38px; padding: 0.2rem 0.75rem; font-weight: 600;">
              <option value="te-IN" selected data-i18n="workVoiceLangTe">తెలుగు (Telugu)</option>
              <option value="hi-IN" data-i18n="workVoiceLangHi">हिन्दी (Hindi)</option>
              <option value="en-IN" data-i18n="workVoiceLangEn">English (India)</option>
            </select>
          </div>

          <button id="asha-mic-btn" class="mic-button" aria-label="Toggle voice recording">
            <i data-lucide="mic" style="width: 40px; height: 40px;"></i>
          </button>

          <div id="asha-status" style="font-size: 1.15rem; font-weight: 800; margin-top: 1.25rem; color: var(--text-main);">
            Tap to Record Voice Note
          </div>

          <div class="voice-wave-container" id="asha-waveform" style="display: none;">
            <div class="voice-bar" style="background: var(--primary-green);"></div>
            <div class="voice-bar" style="background: var(--primary-green);"></div>
            <div class="voice-bar" style="background: var(--primary-green);"></div>
            <div class="voice-bar" style="background: var(--primary-green);"></div>
            <div class="voice-bar" style="background: var(--primary-green);"></div>
          </div>

          <!-- Sample Prompts -->
          <div style="margin-top: 1.75rem; border-top: 1px solid var(--border-subtle); padding-top: 1.25rem;">
            <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.6rem;" data-i18n="workVoiceSamplesTitle">
              Or click a sample field observation:
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;">
              <button class="sample-prompt-chip" data-sample="రోగికి రక్తపోటు కొద్దిగా ఎక్కువగా ఉంది, మాత్రలు రోజూ వేసుకుంటున్నారు.">
                <span data-i18n="workVoiceSample1">"రక్తపోటు ఎక్కువగా ఉంది" (Telugu)</span>
              </button>
              <button class="sample-prompt-chip" data-sample="मरीज को 2 दिन से चक्कर आ रहा है, दवा नियमित रूप से ले रहे हैं।">
                <span data-i18n="workVoiceSample2">"दवा नियमित रूप से ले रहे हैं" (Hindi)</span>
              </button>
              <button class="sample-prompt-chip" data-sample="Patient compliant with diabetes medication. Blood pressure slightly elevated, advised PHC doctor visit.">
                <span data-i18n="workVoiceSample3">"Patient compliant, BP slightly elevated"</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Transcript Card -->
        <div class="card" id="asha-transcript-card" style="margin-top: 1.5rem; display: none;">
          <div class="card-header">
            <span class="card-title" style="font-size: 1.05rem;">
              <i data-lucide="check-circle" style="width: 18px; height: 18px; color: var(--primary-green);"></i>
              <span data-i18n="workVoiceTranscriptTitle">Transcribed ASHA Field Note</span>
            </span>
          </div>
          <textarea id="asha-transcript-text" class="form-control" rows="4"></textarea>
          <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.25rem;">
            <button class="btn btn-outline" id="asha-try-again" data-i18n="workVoiceTryAgain">Try Again</button>
            <button class="btn btn-success btn-lg" id="asha-save-note">
              <i data-lucide="save" style="width: 16px; height: 16px;"></i>
              <span data-i18n="workVoiceSaveBtn">Save to Patient Record</span>
            </button>
          </div>
        </div>
      </main>

      <div id="mobile-nav-mount"></div>
    </div>
  </div>

  <script type="module">
    import { initDatabase, getPatients, addSymptom, addMedicalRecord } from '../js/db/api.js';
    import { initI18n, t } from '../js/core/i18n.js';
    import { initTheme } from '../js/core/theme.js';
    import { renderLayout, showToast } from '../js/core/layout.js';
    import { renderIcons } from '../js/core/icons.js';
    import { VoiceSystem } from '../js/modules/voice.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await initDatabase();
      await initI18n();
      await initTheme();
      renderLayout('worker-voice');

      const patients = await getPatients();
      const patSelect = document.getElementById('voice-pat-select');
      patSelect.innerHTML = patients.map(p => `<option value="${p.id}">${p.name} (${p.healthId}) - ${p.village}</option>`).join('');

      const micBtn = document.getElementById('asha-mic-btn');
      const statusText = document.getElementById('asha-status');
      const waveform = document.getElementById('asha-waveform');
      const transcriptCard = document.getElementById('asha-transcript-card');
      const transcriptText = document.getElementById('asha-transcript-text');
      const langSelect = document.getElementById('asha-voice-lang');

      const voice = new VoiceSystem({
        onResult: (text, isFinal) => {
          transcriptText.value = text;
          transcriptCard.style.display = 'block';
        },
        onStatusChange: (status) => {
          if (status === 'listening') {
            micBtn.classList.add('recording');
            waveform.style.display = 'flex';
            statusText.textContent = t('workVoiceListening');
            statusText.style.color = 'var(--status-emergency)';
          } else {
            micBtn.classList.remove('recording');
            waveform.style.display = 'none';
            statusText.textContent = t('workVoiceTapToRecord');
            statusText.style.color = 'var(--text-main)';
          }
        },
        onError: (err) => {
          const key = err === 'not-allowed' || err === 'service-not-allowed' ? 'micErrBlocked'
            : err === 'speech-not-supported' || err === 'language-not-supported' ? 'micErrUnsupported'
            : err === 'network' ? 'micErrNetwork'
            : 'micErrGeneric';
          showToast(t(key), 'error');
        }
      });

      langSelect.addEventListener('change', (e) => {
        voice.setLanguage(e.target.value);
        showToast(`Voice recognition set to ${langSelect.options[langSelect.selectedIndex].text}`, 'info');
      });

      micBtn.addEventListener('click', () => {
        if (voice.isListening) {
          voice.stop();
        } else {
          const started = voice.start(langSelect.value);
          if (!started) {
            transcriptCard.style.display = 'block';
            transcriptText.placeholder = 'Type field observation here...';
          }
        }
      });

      document.querySelectorAll('.sample-prompt-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          transcriptText.value = chip.getAttribute('data-sample');
          transcriptCard.style.display = 'block';
          showToast('Sample field observation loaded', 'success');
        });
      });

      document.getElementById('asha-try-again').addEventListener('click', () => {
        transcriptText.value = '';
        transcriptCard.style.display = 'none';
        voice.start();
      });

      document.getElementById('asha-save-note').addEventListener('click', async () => {
        const text = transcriptText.value.trim();
        if (!text) {
          showToast('Please speak or type a note first', 'error');
          return;
        }

        const pId = patSelect.value;
        await addMedicalRecord({
          patientId: pId,
          type: 'visit',
          title: 'ASHA Voice Field Observation',
          facility: 'Household Visit',
          doctor: 'Sunita Bai (ASHA)',
          date: new Date().toISOString().split('T')[0],
          summary: text,
          status: 'Clinically Verified',
          createdBy: 'Sunita Bai (ASHA)'
        });

        showToast('Voice observation saved to patient EHR', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      });

      renderIcons();
    });
  </script>
</body>
</html>
